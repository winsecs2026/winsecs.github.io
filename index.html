    header {

      padding: 40px 20px;

      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      color: #003366;
      text-decoration: none;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s, background-color 0.2s;
    }
    .oval-box:hover {
      transform: scale(1.05);
      background-color: #bfefff; /* lighter blue on hover */
    }
    footer {
      text-align: center;
      padding: 20px;
