<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win Securities Limited 贏證券有限公司</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-image: url('image/Web Page Background.png');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      background-color: #f9f9f9; /* fallback */
    }
    header {
      background-color: rgba(0, 51, 102, 0.85);
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      background-color: rgba(0, 85, 153, 0.85);
      display: flex;
      justify-content: center;
    }
    nav a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
      display: block;
      transition: background-color 0.3s, color 0.3s;
    }
    nav a:hover {
      background-color: #003366;
    }
    nav a.active {
      background-color: #003366;
      color: #ffd700; /* gold highlight for active link */
      border-radius: 4px;
    }
    main {
      padding: 60px;
      max-width: 1200px;
      margin: auto;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      text-align: center;
    }
    .container {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 40px;
    }
    .oval-box {
      width: 200px;
      height: 80px;
      background-color: #add8e6; /* light blue */
      border-radius: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      color: #003366;
      text-decoration: none;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s, background-color 0.2s;
    }
    .oval-box:hover {
      transform: scale(1.05);
      background-color: #bfefff; /* lighter blue on hover */
    }
    footer {
      background-color: rgba(0, 51, 102, 0.85);
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Win Securities Limited 贏證券有限公司</h1>
    <p>官方網站</p>
  </header>

  <nav>
    <a href="index.html" class="active">首頁</a>
    <a href="about.html">關於我們</a>
    <a href="services.html">客戶服務</a>
    <a href="download.html">表格下載</a>
    <a href="contact.html">聯絡我們</a>
  </nav>

  <main>
    <h2>選擇服務</h2>
  <div class="container">
    <div class="oval-box" style="cursor: not-allowed; background-color: #ddd; color: #666;">
      網上交易<br><small>(即將推出)</small>
    </div>
    <div class="oval-box" style="cursor: not-allowed; background-color: #ddd; color: #666;">
      手機程式下載<br><small>(即將推出)</small>
    </div>
  </div>
  </main>

  <footer>
    <p>&copy; 2026 贏證券有限公司 | 聯絡電話: (852)22627228 </p>
  </footer>

  <script>
    // Add interactivity: highlight active nav link
    const navLinks = document.querySelectorAll('nav a');
    navLinks.forEach(link => {
      link.addEventListener('click', function() {
        navLinks.forEach(l => l.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
